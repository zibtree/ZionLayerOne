name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Go protocol validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Verify formatting
        run: |
          files=$(find . -name "*.go" -not -path "./vendor/*")
          test -z "$(gofmt -l $files)"

      - name: Run tests
        run: go test ./...

      - name: Race test
        run: go test ./... -race

      - name: Static analysis
        run: go vet ./...

      - name: Build node
        run: go build ./cmd/ziond

      - name: Validate repository structure
        run: |
          test -d core
          test -d consensus
          test -d vm
          test -d rpc
          test -d sdk
          test -d cmd/ziond

      - name: Validate protocol docs
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f LICENSE
